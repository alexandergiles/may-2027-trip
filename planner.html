<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>May 2027 trip options</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>May 2027 trip</h1>
    <span class="sub">compare &amp; shape the options</span>
  </div>

  <!-- Tabs: the hash (#overview, #compare, #detail/alps …) drives the view -->
  <nav class="tabs" id="tabs" aria-label="Views">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#compare" data-tab="compare">Compare</a>
    <a href="#detail" data-tab="detail">Detail</a>
    <a href="#questions" data-tab="questions">Group questions</a>
    <a href="#log" data-tab="log">Decision log</a>
    <a href="index.html" class="ext" title="The public, read-only shortlist page with photos">Shortlist ↗</a>
  </nav>

  <div class="toolbar">
    <button type="button" data-action="export" title="Download the full current state as a JSON file">Export JSON</button>
    <button type="button" data-action="import" title="Load a previously exported JSON file">Import JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button type="button" data-action="print" title="Print the current view">Print</button>
    <button type="button" data-action="reset" class="danger" title="Throw away browser edits and reload data.js">Reset to defaults</button>
  </div>
</header>

<!-- Everything below is rendered by app.js -->
<main id="app" class="app"></main>

<footer class="foot">
  <span id="saveStatus">Edits save automatically to this browser (localStorage).</span>
  <span class="muted">Hand-edit <code>data.js</code>, then Reset to defaults to load it.</span>
</footer>

<!-- data.js must come first: it defines window.TRIP_DATA -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
